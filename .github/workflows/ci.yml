name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/jed220143/mini-telemetry-api
  SIMULATOR_IMAGE: ghcr.io/jed220143/mini-telemetry-simulator

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose configurations
        env:
          POSTGRES_PASSWORD: ci_validation_only
        run: |
          docker compose -f infra/compose/compose.yaml config --quiet
          docker compose -f infra/compose/compose.yaml -f infra/compose/compose.local.yaml config --quiet

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: python -m pip install -e "api[dev]"

      - name: Run API tests
        working-directory: api
        run: python -m pytest

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs:
      - api-tests
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build API image
        run: docker build -t mini-telemetry-api:ci api

      - name: Build simulator image
        run: docker build -t mini-telemetry-simulator:ci simulator

      - name: Verify application images use non-root users
        run: |
          test "$(docker run --rm --entrypoint id mini-telemetry-api:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id mini-telemetry-simulator:ci -u)" != "0"

  publish-images:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - api-tests
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images with immutable SHA tags
        run: |
          docker build -t "${API_IMAGE}:sha-${GITHUB_SHA}" api
          docker build -t "${SIMULATOR_IMAGE}:sha-${GITHUB_SHA}" simulator

      - name: Verify application images use non-root users
        run: |
          test "$(docker run --rm --entrypoint id "${API_IMAGE}:sha-${GITHUB_SHA}" -u)" != "0"
          test "$(docker run --rm --entrypoint id "${SIMULATOR_IMAGE}:sha-${GITHUB_SHA}" -u)" != "0"

      - name: Push immutable SHA tags
        run: |
          docker push "${API_IMAGE}:sha-${GITHUB_SHA}"
          docker push "${SIMULATOR_IMAGE}:sha-${GITHUB_SHA}"

      - name: Push latest tags from main
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "${API_IMAGE}:sha-${GITHUB_SHA}" "${API_IMAGE}:latest"
          docker tag "${SIMULATOR_IMAGE}:sha-${GITHUB_SHA}" "${SIMULATOR_IMAGE}:latest"
          docker push "${API_IMAGE}:latest"
          docker push "${SIMULATOR_IMAGE}:latest"

      - name: Push version tags from Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag "${API_IMAGE}:sha-${GITHUB_SHA}" "${API_IMAGE}:${GITHUB_REF_NAME}"
          docker tag "${SIMULATOR_IMAGE}:sha-${GITHUB_SHA}" "${SIMULATOR_IMAGE}:${GITHUB_REF_NAME}"
          docker push "${API_IMAGE}:${GITHUB_REF_NAME}"
          docker push "${SIMULATOR_IMAGE}:${GITHUB_REF_NAME}"
